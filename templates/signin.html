{% extends "base.html" %}
{% block title %}Sign In - HRMS{% endblock %}
{% block content %}
<div class="card">
  <div class="logo-placeholder">App/Web Logo</div>

  <form method="POST" action="{{ url_for('signin') }}">
    <label for="login_id">Login Id/Email :-</label>
    <input type="text" id="login_id" name="login_id" placeholder="e.g. OIJODO20260001 or you@company.com" required>

    <div class="password-row">
      <label for="password">Password :-</label>
      <input type="password" id="password" name="password" required>
      <button type="button" class="toggle-visibility" onclick="togglePwd('password', this)">show</button>
    </div>

    <button type="submit" class="btn-primary">SIGN IN</button>
  </form>

  <div class="switch-link">
    Don't have an account? <a href="{{ url_for('signup') }}">Sign Up</a>
  </div>
</div>

<script>
function togglePwd(id, btn) {
  const el = document.getElementById(id);
  if (el.type === "password") { el.type = "text"; btn.textContent = "hide"; }
  else { el.type = "password"; btn.textContent = "show"; }
}
</script>
{% endblock %}
